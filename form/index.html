<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Fieldnote</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --ink: #1b1b1a;
    --muted: #5d5c58;
    --line: #d9d8d3;
    --accent: #1c5cab;
    --ok: #0c7a0c;
    --bad: #b42f2f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .lead { margin: 0 0 24px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; margin-bottom: 14px; font-size: 14px; color: var(--muted); }
  input, select, textarea {
    display: block; width: 100%; margin-top: 4px; padding: 9px 10px;
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 8px;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  button {
    padding: 10px 18px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.plain { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #result { margin-top: 20px; padding: 14px; border-radius: 8px; display: none; }
  #result.ok { display: block; background: #eef7ee; border: 1px solid #b9dcb9; }
  #result.bad { display: block; background: #fbeeee; border: 1px solid #e5bcbc; }
  #result pre { margin: 8px 0 0; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .note { font-size: 13px; color: var(--bad); }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Talk to Fieldnote</h1>
    <p class="lead">Project tracking for construction teams. Tell us about your company and we will get back to you.</p>
    <p class="note" id="setup" hidden>Add <code>?webhook=https://your-n8n/webhook/lead-intake</code> to this page's address to send leads.</p>

    <form id="lead-form">
      <div class="row">
        <label>First name <input name="first_name" required></label>
        <label>Last name <input name="last_name"></label>
      </div>
      <div class="row">
        <label>Work email <input name="email" type="email" required></label>
        <label>Phone <input name="phone"></label>
      </div>
      <div class="row">
        <label>Company <input name="company"></label>
        <label>Website <input name="website" placeholder="www.example.com"></label>
      </div>
      <div class="row">
        <label>Job title <input name="job_title"></label>
        <label>Company size
          <select name="company_size">
            <option value="1-10">1-10</option>
            <option value="11-50">11-50</option>
            <option value="51-200" selected>51-200</option>
            <option value="201-1000">201-1000</option>
            <option value="1000+">1000+</option>
          </select>
        </label>
      </div>
      <label>Country
        <select name="country">
          <option value="US">United States</option>
          <option value="UK">United Kingdom</option>
          <option value="CA">Canada</option>
          <option value="AU">Australia</option>
        </select>
      </label>
      <label>How can we help? <textarea name="message" required></textarea></label>
      <div class="actions">
        <button type="submit" id="send">Send</button>
        <button type="button" class="plain" id="sample">Fill a sample lead</button>
      </div>
    </form>

    <div id="result" role="status" aria-live="polite"><strong id="headline"></strong><pre id="raw"></pre></div>
  </div>
</main>

<script>
  const webhook = new URLSearchParams(location.search).get("webhook");
  const form = document.getElementById("lead-form");
  const sendButton = document.getElementById("send");
  const result = document.getElementById("result");

  if (!webhook) {
    document.getElementById("setup").hidden = false;
    sendButton.disabled = true;
  }

  const MESSAGES = {
    ok: "Thanks, we got it.",
    duplicate: "We already have you. Your contact was updated.",
    already_processed: "This exact form was already received.",
    rejected: "Please check your email and name.",
    queued: "Thanks, we got it. It will reach our team in a few minutes.",
  };

  // The flow only accepts a UUID as submission id, so the fallback builds one too.
  function newId() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
  }

  function show(kind, headline, body) {
    result.className = kind;
    document.getElementById("headline").textContent = headline;
    document.getElementById("raw").textContent = body;
  }

  // Fictional lead for demos. A new email each click, so the first send is always a new contact.
  document.getElementById("sample").addEventListener("click", () => {
    const tag = Math.floor(1000 + Math.random() * 9000);
    const values = {
      first_name: "Dana",
      last_name: "Whitfield",
      email: `dana.whitfield${tag}@whitfield-builders.example.com`,
      phone: "(312) 555-0142",
      company: "Whitfield Builders",
      website: "https://www.whitfield-builders.example.com",
      job_title: "Operations Manager",
      company_size: "201-1000",
      country: "US",
      message: "We run 35 active sites and our daily reports still live in spreadsheets. Can we book a demo for our project managers next week?",
    };
    for (const [name, value] of Object.entries(values)) form.elements[name].value = value;
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const lead = Object.fromEntries(new FormData(form));
    lead.submission_id = newId();
    lead.submitted_at = new Date().toISOString();
    sendButton.disabled = true;
    show("ok", "Sending...", "");
    try {
      const response = await fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(lead),
      });
      const body = await response.json();
      const headline = MESSAGES[body.status] || "Unexpected answer.";
      show(response.ok ? "ok" : "bad", headline, `HTTP ${response.status} ${JSON.stringify(body)}`);
    } catch (error) {
      show("bad", "Could not reach the server. Please try again.", String(error));
    } finally {
      sendButton.disabled = false;
    }
  });
</script>
</body>
</html>
